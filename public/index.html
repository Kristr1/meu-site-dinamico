<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodleans</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <h1>Goodleans</h1>
        <nav class="navegacao-principal" aria-label="Navegação principal">
            <a href="/calculadora-precos">Calculadora de preços</a>
        </nav>
        <div id="area-autenticacao">
            <a href="/create-account" class="btn-signin">Criar conta</a>
        </div>
    </header>
    <div class="hero-banner" role="img" aria-label="Banner"></div>
    <main>
        <button onclick="avisar()">Clique Aqui</button>
    </main>
    <footer>
      <p>Este é um site estático criado do zero! Ele é ultra rápido e seguro.</p>
    </footer>

    <script>
        function avisar() {
            alert("cão!     ESTE SITE ESTA EM DESENVOLVIMENTO!!!!!");
        }
        
        function SignIn() {
            alert("Sign-in!");
        }

        // Verificar a sessão ativa assim que a página carrega
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const resposta = await fetch('/api/perfil');
                const dados = await resposta.json();
                const areaAuth = document.getElementById('area-autenticacao');

                if (dados.autenticado && areaAuth) {
                    areaAuth.innerHTML = `
                        <div class="sessao-atual">
                            <span class="sessao-email">${dados.email}</span>
                            <button onclick="terminarSessao()" class="btn-signin btn-sair">Sair</button>
                        </div>
                    `;
                }
            } catch (erro) {
                console.error('Erro ao verificar a sessão:', erro);
            }
        });

        // Encerrar a sessão (Logout)
        async function terminarSessao() {
            await fetch('/api/sair', { method: 'POST' });
            window.location.reload();
        }
    </script>
</body>
</html>
