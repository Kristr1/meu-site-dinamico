<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meu Site</title>
    <link rel="stylesheet" href="login.css">
</head>
<body class="pagina-login">

    <div class="login-side-image login-side-image-left" aria-hidden="true"></div>

    <div class="login-image">
        <h2>Entrar na sua Conta</h2>
        <p class="subtitle">Insira os seus dados para aceder.</p>

        <form onsubmit="fazerLogin(event)">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <div class="form-actions">
                <a href="/login" class="esqueci-senha">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-entrar">Entrar</button>
        </form>
    </div>

    <main class="login-container">
        <a href="/" class="btn-voltar">← Voltar ao Início</a>
        <p>ola</p>
    </main>

    <div class="login-side-image login-side-image-right" aria-hidden="true"></div>

    <script>
        function fazerLogin(event) {
            event.preventDefault(); // Impede a página de recarregar
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            // Simulação de login
            alert(`Tentativa de login com:\nE-mail: ${email}`);
        }
    </script>

</body>
</html>
