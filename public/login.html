<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meu Site</title>
    <link rel="stylesheet" href="create-account.css">
</head>
<body class="pagina-login">

    <div class="login-side-image login-side-image-left" aria-hidden="true"></div>

    <div class="login-image">
        <h2>Entrar na sua Conta</h2>
        <p class="subtitle">Insira os seus dados para entrar.</p>

        <form onsubmit="fazerLogin(event)">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <div class="form-actions">
                <a href="/create-account" class="esqueci-senha">Criar conta</a>
            </div>

            <button type="submit" class="btn-entrar">Entrar</button>
        </form>
    </div>

    <main class="login-container">
        <a href="/" class="btn-voltar">← Voltar ao Início</a>
        <p>ola</p>
    </main>

    <div class="login-side-image login-side-image-right" aria-hidden="true"></div>

    <script>
    async function fazerLogin(event) {
        event.preventDefault(); // Impede o recarregamento da página

        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        try {
        // Envia os dados com encriptação HTTPS para o Back-end
        const resposta = await fetch('/api/entrar', {
            method: 'POST',
            headers: {
            'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, senha })
        });

        const resultado = await resposta.json();

        if (resposta.ok) {
            alert(resultado.mensagem);
            window.location.href = '/';
        } else {
            alert('Erro: ' + resultado.mensagem);
        }
        } catch (erro) {
        alert('Erro ao ligar ao servidor.');
        }
    }
    </script>

</body>
</html>
